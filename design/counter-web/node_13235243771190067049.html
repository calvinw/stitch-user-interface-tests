  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Spline+Sans+Mono:wght@500&amp;family=Wix+Madefor+Display:wght@600;700&amp;display=swap" rel="stylesheet">

<body class="bg-light-surface text-light-on-surface antialiased">
  <main class="min-h-screen w-full bg-light-surface flex flex-col items-center justify-center p-section">
    <div class="w-full max-w-md flex flex-col items-center gap-gutter-lg">
      <!-- COMPONENT: card-action -->
      <article data-component-id="card-action" data-component-type="card" data-component-variant="action" class="w-full bg-light-surface-container-lowest border border-light-outline-variant rounded-xl p-gutter-xl flex flex-col items-center gap-gutter-xl">
        <header class="w-full flex flex-col items-center gap-gutter-xs text-center">
          <h1 class="font-headline text-headline-lg-mobile md:text-headline-lg text-light-on-surface" data-design-text-token="headline-lg">Counter</h1>
          <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">Click or use arrow keys to adjust</p>
        </header>

        <div class="w-full bg-light-surface-container-low rounded-lg py-section px-gutter-xl flex items-center justify-center">
          <!-- COMPONENT: typography-display -->
          <span id="count-display" role="status" aria-live="polite" aria-atomic="true" data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg" class="font-display text-display-lg-mobile md:text-display-lg text-light-on-surface tabular-nums transition-transform duration-state-change ease-state-change">0</span>
        </div>

        <footer class="w-full grid grid-cols-2 gap-gutter-md">
          <!-- COMPONENT: button-secondary -->
          <button id="decrement-btn" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" aria-label="Decrement count" class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md rounded-lg bg-light-secondary-container text-light-on-secondary-container transition-transform duration-state-change ease-state-change hover:opacity-90 active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-secondary cursor-pointer">
            <span class="material-symbols-outlined" aria-hidden="true">remove</span>
            <span class="font-label text-label-lg" data-design-text-token="label-lg">Minus</span>
          </button>

          <!-- COMPONENT: button-primary -->
          <button id="increment-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" aria-label="Increment count" class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md rounded-lg bg-light-primary text-light-on-primary transition-transform duration-state-change ease-state-change hover:opacity-95 active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary cursor-pointer">
            <span class="material-symbols-outlined" aria-hidden="true">add</span>
            <span class="font-label text-label-lg" data-design-text-token="label-lg">Plus</span>
          </button>
        </footer>
      </article>

      <div class="flex flex-col items-center gap-gutter-sm">
        <!-- COMPONENT: button-with-icon -->
        <button id="reset-btn" data-component-id="button-with-icon" data-component-type="button" data-component-variant="with-icon" type="button" disabled class="inline-flex items-center justify-center gap-gutter-sm px-gutter-md py-gutter-sm rounded-full bg-light-surface-container text-light-on-surface-variant border border-light-outline-variant transition-transform duration-state-change ease-state-change hover:bg-light-surface-container-high active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary disabled:bg-light-surface-container-low disabled:border-light-surface-variant disabled:cursor-not-allowed cursor-pointer">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">restart_alt</span>
          <span class="font-label text-label-lg" data-design-text-token="label-lg">Reset</span>
        </button>

        <!-- COMPONENT: typography-label -->
        <span data-component-id="typography-label" data-component-type="typography" data-component-variant="label" data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">Keyboard: ↑ / ↓ to count · R to reset</span>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var count = 0;
      var display = document.getElementById('count-display');
      var incBtn = document.getElementById('increment-btn');
      var decBtn = document.getElementById('decrement-btn');
      var resetBtn = document.getElementById('reset-btn');

      function updateDisplay() {
        display.textContent = String(count);
        resetBtn.disabled = count === 0;
        display.classList.add('scale-105');
        window.setTimeout(function () {
          display.classList.remove('scale-105');
        }, 100);
      }

      incBtn.addEventListener('click', function () {
        count += 1;
        updateDisplay();
      });

      decBtn.addEventListener('click', function () {
        count -= 1;
        updateDisplay();
      });

      resetBtn.addEventListener('click', function () {
        count = 0;
        updateDisplay();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowUp' || event.key === '+' || event.key === '=') {
          event.preventDefault();
          count += 1;
          updateDisplay();
        } else if (event.key === 'ArrowDown' || event.key === '-') {
          event.preventDefault();
          count -= 1;
          updateDisplay();
        } else if (event.key === 'r' || event.key === 'R') {
          if (count !== 0) {
            count = 0;
            updateDisplay();
          }
        }
      });
    })();
  </script>
